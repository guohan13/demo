<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞书日历 · IP Demo</title><style>
html,body{margin:0;height:100%;background:#e9e9e9;overflow:hidden;touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:0 0;background:url(bg@2x.png) 0 0/1440px 900px no-repeat}
/* Figma: frame "IP" 347:96178 at (0,831,180,69); instance 读屏中 347:96179 at (8,839,64,53) */
#ipmod{position:absolute;left:4px;top:839px;width:64px;height:53px;transform:scale(1.9);transform-origin:0 92%}
#bubble{position:absolute;left:15px;top:0.5px;width:48px;height:28.5px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:3px}
#bubble i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:dot 1.2s infinite}
#bubble i:nth-child(2){animation-delay:.2s}#bubble i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{background:#b5b5b5}30%{background:#111}}
#ip{position:absolute;left:2px;top:16px;width:37px;height:37px;overflow:visible}
</style></head><body><div id="stage" style="background-image:url(bg@2x.png)">
<div id="ipmod"><div id="bubble"><i></i><i></i><i></i></div>
<svg id="ip" viewBox="0 0 1000 1000">
<defs>
<linearGradient id="g" x1="0.25" y1="0.1" x2="0.65" y2="1"><stop offset="0" stop-color="#57B5FD"/><stop offset="1" stop-color="#8EEBFB"/></linearGradient>
<radialGradient id="hl" cx="0.3" cy="0.2" r="0.5"><stop offset="0" stop-color="#4fa8ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fa8ff" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
<clipPath id="clip"><path id="cp"/></clipPath>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="25"/></filter>
</defs>
<ellipse id="sh" cx="500" cy="930" rx="300" ry="28" fill="#7cc8f0" opacity=".18" filter="url(#shadow)"/>
<g id="body">
<path id="halo" fill="#8EEBFB" opacity=".35" filter="url(#soft)"/>
<path id="main" fill="url(#g)"/>
<path id="hlp" fill="url(#hl)"/>
<g clip-path="url(#clip)"><path id="rim" fill="none" stroke="#fff" stroke-width="40" opacity=".55" filter="url(#edge)"/></g>
<g id="eyes"><rect id="e1" fill="#fff"/><rect id="e2" fill="#fff"/></g>
</g></svg>
</div></div>
<script>
const st=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1440,innerHeight/900);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.transform=`translate(${-720*k}px,${-450*k}px) scale(${k})`}
addEventListener('resize',fit);fit();

const $=id=>document.getElementById(id), svg=document.getElementById('ip');
const base=[[515,82],[300,200],[112,540],[230,790],[510,855],[810,770],[868,560],[720,190]];
function path(p){let d=`M${p[0][0]},${p[0][1]}`,n=p.length;for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d+'Z'}
let tx=0,ty=0,lx=0,ly=0,blink=1,t0=performance.now();
function aim(cx,cy){const r=svg.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.45;
let dx=(cx-ox)/(innerWidth*.45),dy=(cy-oy)/(innerHeight*.45);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}tx=Math.max(-1,Math.min(1,dx*1.4));ty=Math.max(-1,Math.min(1,dy*1.4))}
addEventListener('pointermove',e=>{if(e.clientX||e.clientY)aim(e.clientX,e.clientY)});
addEventListener('touchmove',e=>{const t=e.touches[0];aim(t.clientX,t.clientY)},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{tx=0;ty=0});addEventListener('blur',()=>{tx=0;ty=0});
// blink scheduler
let blinkStart=-1,queue=[];
function sched(){setTimeout(()=>{queue.push(0);if(Math.random()<.18)queue.push(260);queue.forEach(d=>setTimeout(()=>blinkStart=performance.now(),d));queue=[];sched()},1200+Math.random()*1600)}sched();
function frame(now){lx+=(tx-lx)*.1;ly+=(ty-ly)*.1;const t=(now-t0)/1000;
// body morph: points lean toward cursor, top leans more
const br=1+Math.sin(t*2)*.008;
const dn=Math.max(0,ly), lyB=Math.max(-.6,Math.min(.6,ly));
const p=base.map(([x,y])=>{const k=Math.max(0,Math.min(1,(760-y)/620));return[500+(x-500)*br+lx*130*k*(1-dn*.35),880-(880-y)*br+lyB*30*k]});
p[7][0]+=lx*30*(1-dn*.35);p[1][0]+=lx*20*(1-dn*.35);
const d=path(p);['main','halo','hlp','rim','cp'].forEach(i=>$(i).setAttribute('d',d));
$('body').setAttribute('transform',`rotate(${lx*4*(1-dn*.5)} 500 880)`);$('sh').setAttribute('cx',500+lx*30);
// blink
let s=1;if(blinkStart>0){const e=(now-blinkStart)/150;if(e<1)s=1-.9*Math.sin(e*Math.PI);else blinkStart=-1}
const ax=Math.abs(lx);
[[392,$('e1'),-1],[590,$('e2'),1]].forEach(([x,el,side])=>{
 const w=80*(1-ax*.22), h=172*(1-ax*.08);
 const gap=(x-491)*(1-ax*.22);const cx=491+gap+lx*230*(1+Math.min(0,ly)*.4-dn*.35), cy=302+(ly<0?Math.max(-.5,ly)*170:Math.min(1,ly)*320);
 el.setAttribute('x',cx-w/2);el.setAttribute('y',cy-h/2);el.setAttribute('width',w);el.setAttribute('height',h);el.setAttribute('rx',w/2);
 el.setAttribute('transform',`rotate(${-lx*32*(1-dn*.8)} ${cx} ${cy}) translate(0 ${0}) `+`translate(${cx} ${cy}) scale(1 ${s}) translate(${-cx} ${-cy})`)});
requestAnimationFrame(frame)}requestAnimationFrame(frame);

</script></body></html>
