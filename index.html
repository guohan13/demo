<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞书日历 · IP Demo</title><style>
html,body{margin:0;height:100%;background:#e9e9e9;overflow:hidden;touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:0 0;background:url(bg@2x.png) 0 0/1440px 900px no-repeat}
/* Figma: frame "IP" 347:96178 at (0,831,180,69); instance 读屏中 347:96179 at (8,839,64,53) */
#ipmod{position:absolute;left:4px;top:839px;width:64px;height:53px;transform:scale(1.9);transform-origin:0 92%}
#bubble{position:absolute;left:15px;top:0.5px;width:48px;height:28.5px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:3px}
#bubble i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:dot 1.2s infinite}
#bubble i:nth-child(2){animation-delay:.2s}#bubble i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{background:#b5b5b5}30%{background:#111}}
#ip{position:absolute;left:2px;top:16px;width:37px;height:37px;overflow:visible}
</style></head><body><div id="stage" style="background-image:url(bg@2x.png)">
<div id="ipmod"><div id="bubble"><i></i><i></i><i></i></div>
<svg id="ip" viewBox="0 0 1000 1000">
<defs>
<linearGradient id="g" x1="0.25" y1="0.08" x2="0.6" y2="1"><stop offset="0" stop-color="#57B5FD"/><stop offset="1" stop-color="#8EEBFB"/></linearGradient>
<radialGradient id="hl" gradientUnits="userSpaceOnUse" cx="350" cy="220" r="380"><stop offset="0" stop-color="#3f9dfb" stop-opacity=".45"/><stop offset="1" stop-color="#3f9dfb" stop-opacity="0"/></radialGradient>
<radialGradient id="lt" gradientUnits="userSpaceOnUse" cx="600" cy="300" r="260"><stop offset="0" stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="sd" gradientUnits="userSpaceOnUse" cx="500" cy="900" r="420"><stop offset="0" stop-color="#2c8fe0" stop-opacity=".28"/><stop offset="1" stop-color="#2c8fe0" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="eb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="25"/></filter>
<clipPath id="clip"><path id="cp"/></clipPath>
</defs>
<ellipse id="sh" cx="500" cy="960" rx="300" ry="26" fill="#7cc8f0" opacity=".16" filter="url(#shadow)"/>
<g id="jump"><g id="body">
<path id="halo" fill="#8EEBFB" opacity=".35" filter="url(#soft)"/>
<path id="main" fill="url(#g)"/>
<g clip-path="url(#clip)">
 <rect x="-100" y="-100" width="1200" height="1200" fill="url(#hl)" id="hlr"/>
 <rect x="-100" y="-100" width="1200" height="1200" fill="url(#sd)"/>
 <rect x="-100" y="-100" width="1200" height="1200" fill="url(#lt)"/>
 <path id="rim" fill="none" stroke="#fff" stroke-width="44" opacity=".55" filter="url(#edge)"/>
 <g id="eyes" filter="url(#eb)"><rect id="e1" fill="#fff"/><rect id="e2" fill="#fff"/></g>
</g>
</g></g></svg>
</div></div>
<script>
const st=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1440,innerHeight/900);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.transform=`translate(${-720*k}px,${-450*k}px) scale(${k})`}
addEventListener('resize',fit);fit();
//JS
(()=>{
const $=id=>document.getElementById(id), svg=$('ip');
// silhouettes, same point order (clockwise from top)
const FRONT=[[515,82],[700,165],[812,350],[868,560],[835,745],[640,848],[420,856],[205,790],[112,560],[270,225]];
const SIDE =[[380,92],[620,172],[835,325],[900,500],[815,715],[575,880],[395,930],[215,840],[86,610],[112,250]];
const N=36,CX=500,CY=520;
function polar(pts){ // resample closed polygon to N points at equal angles around (CX,CY)
  const out=[];for(let k=0;k<N;k++){const th=-Math.PI/2+k*2*Math.PI/N, dx=Math.cos(th), dy=Math.sin(th);
   let best=null;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];
    const ex=b[0]-a[0],ey=b[1]-a[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;
    const t=((a[0]-CX)*ey-(a[1]-CY)*ex)/den,u=((a[0]-CX)*dy-(a[1]-CY)*dx)/den;
    if(t>0&&u>=0&&u<=1&&(best===null||t<best))best=t}
   out.push([CX+dx*best,CY+dy*best])}return out}
function dense(p){const o=[],n=p.length;for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
 for(let s=0;s<8;s++){const t=s/8,t2=t*t,t3=t2*t;o.push([0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}return o}
const PF=polar(dense(FRONT)), PR=polar(dense(SIDE)), PL=polar(dense(SIDE.map(([x,y])=>[1000-x,y])));
function shape(f){const a=Math.min(1,Math.abs(f)),e=a*a*(3-2*a),Q=f>=0?PR:PL;
  return PF.map((p,i)=>[p[0]+(Q[i][0]-p[0])*e,p[1]+(Q[i][1]-p[1])*e]);}
function path(p){let d=`M${p[0][0]},${p[0][1]}`,n=p.length;for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d+'Z'}
const D=Math.PI/180, YMAX=58, PMAX=26, R=262, OFF=22.2;
const IDLE={yaw:53,pitch:0};
let tYaw=IDLE.yaw,tPitch=IDLE.pitch,yaw=tYaw,pitch=tPitch,vy=0,vp=0;
function aim(cx,cy){const r=svg.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.42;
 const sc=Math.max(innerWidth,innerHeight)*.35;let dx=(cx-ox)/sc,dy=(cy-oy)/sc;
 tYaw=YMAX*Math.tanh(dx*1.3);tPitch=PMAX*Math.tanh(dy*1.3);}
let lastMove=-1e9,onPage=false;function idle(){tYaw=IDLE.yaw;tPitch=IDLE.pitch;onPage=false}
function mv(){lastMove=performance.now();onPage=true}
addEventListener('pointermove',e=>{if(e.clientX||e.clientY){aim(e.clientX,e.clientY);mv()}});
addEventListener('touchmove',e=>{const t=e.touches[0];aim(t.clientX,t.clientY);mv()},{passive:true});
document.documentElement.addEventListener('pointerleave',idle);addEventListener('blur',idle);
document.addEventListener('mouseout',e=>{if(!e.relatedTarget)idle()});
// blink (unchanged)
let blinkStart=-1;
const RM=matchMedia('(prefers-reduced-motion: reduce)'), Q=location.search;
let spinStart=-1, spinDir=1, nextSpin=performance.now()+(Q.includes('spinsoon')?600:4000);
window.__spin=()=>{spinStart=performance.now();spinDir=tYaw<0?-1:1};
const SP={dur:1250,crouch:130,take:130,land:900};
function eo(x){return 1-Math.pow(1-x,3)} function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function jumpState(now){ // returns {ty,sx,sy,spin(0..1),air(0..1)}
 if(spinStart<0)return null; const t=now-spinStart; if(t>SP.dur){spinStart=-1;return null}
 let ty=0,sx=1,sy=1,sp=0,air=0;
 if(t<SP.crouch){const e=Math.sin(t/SP.crouch*Math.PI/2);sy=1-.13*e;sx=1+.09*e}
 else if(t<SP.land){const u=(t-SP.crouch)/(SP.land-SP.crouch);
   ty=-230*(1-Math.pow(2*u-1,2)); air=Math.sin(u*Math.PI);
   const st=Math.max(0,1-u/.3); sy=1+.10*st; sx=1-.06*st;
   sp=(1-Math.cos(Math.PI*Math.min(1,Math.max(0,(u-.04)/.9))))/2;}
 else {const v=(t-SP.land)/(SP.dur-SP.land); const b=Math.exp(-5*v)*Math.cos(v*Math.PI*3.2);
   sy=1-.14*b; sx=1+.09*b; sp=1}
 return {ty,sx,sy,sp,air};}
(function sched(){if(location.search.includes('noblink'))return;setTimeout(()=>{if(spinStart<0){blinkStart=performance.now();if(Math.random()<.18)setTimeout(()=>{if(spinStart<0)blinkStart=performance.now()},260)}sched()},1200+Math.random()*1600)})();
let last=performance.now(),fz=0,vf=0;const t0=last;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 // spring (slight lag + soft settle)
 const k=55,c=13; vy+=((tYaw-yaw)*k-vy*c)*dt; yaw+=vy*dt; vp+=((tPitch-pitch)*k-vp*c)*dt; pitch+=vp*dt;
 if(!RM.matches&&!Q.includes('nospin')&&spinStart<0&&now>=nextSpin){window.__spin();nextSpin=now+4000}
 const J=jumpState(now);
 const tf=(!J&&onPage&&now-lastMove>700)?1:0; vf+=((tf-fz)*(J?260:170)-vf*17)*dt; fz+=vf*dt; const fc=Math.max(0,fz); const Y=yaw+(J?spinDir*360*J.sp:0);
 const sY=Math.sin(Y*D), cY=Math.cos(Y*D);
 const f=Math.max(-1,Math.min(1,sY/Math.sin(YMAX*D)))*(cY<0?Math.max(0,1+cY*1.6):1)+0, af=Math.abs(f), pf=pitch/PMAX, t=(now-t0)/1000;
 // silhouette: stable, only blends between front & 3/4 view + tiny tilt
 const p=shape(f), br=1+Math.sin(t*2)*.006;
 const pts=p.map(([x,y])=>[500+(x-500)*br, 900-(900-y)*br+pf*10*(900-y)/820]);
 const d=path(pts);['main','halo','rim','cp'].forEach(i=>$(i).setAttribute('d',d));
 $('body').setAttribute('transform',`rotate(${f*2} 500 900) translate(500 900) scale(${1+fc*.02} ${1-fc*.012}) translate(-500 -900)`);
 const jt=J||{ty:0,sx:1,sy:1,air:0};
 $('jump').setAttribute('transform',`translate(0 ${jt.ty}) translate(500 905) scale(${jt.sx} ${jt.sy}) translate(-500 -905)`);
 const shs=1-jt.air*.45; $('sh').setAttribute('transform',`translate(${500+f*25} 960) scale(${shs}) translate(-500 -960)`);$('sh').setAttribute('opacity',.16*(1-jt.air*.6));
 // shading moves with gaze
 const hl=$('hl'),sd=$('sd'),lt=$('lt');
 hl.setAttribute('cx',380-f*90);hl.setAttribute('cy',230-pf*70);
 sd.setAttribute('cx',500-f*170);sd.setAttribute('cy',930-pf*80);
 lt.setAttribute('cx',500+f*170);lt.setAttribute('cy',330+pf*110);
 // sphere-projected eyes
 const C=[491-af*Math.sign(f)*91, 315+af*95], roll=-f*26*D;
 let s=1;if(J)blinkStart=-1;if(blinkStart>0){const e=(now-blinkStart)/150;if(e<1)s=1-.9*Math.sin(e*Math.PI);else blinkStart=-1}
 const cp=Math.cos(pitch*D);
 [[-OFF,$('e1')],[OFF,$('e2')]].forEach(([off,el])=>{
  const m=Math.min(1,fc), lon=((Y-yaw)+yaw*(1-.4*m)+off*(1+.45*m))*D, cos=Math.cos(lon), cl=Math.max(0,cos);
  const vis=Math.max(0,Math.min(1,(cos+.02)/.2)); el.setAttribute('opacity',vis);
  let ex=R*Math.sin(lon), ey=R*Math.sin(pitch*D)*(pitch<0?.9*(1-.4*m):1.5);
  const rx=ex*Math.cos(roll)-ey*Math.sin(roll), ry=ex*Math.sin(roll)+ey*Math.cos(roll);
  const cx=C[0]+rx, cy=C[1]+ry;
  const pw=86*(.42+.58*cl), ph=172*(.86+.14*cl)*(1-Math.max(0,-pf)*.12)*(.92+.08*cp);
  const Dm=155*(.88+.12*cl)*(1+Math.max(0,fz-1));
  const w=pw+(Dm-pw)*m, h=ph+(Dm-ph)*m;
  el.setAttribute('x',cx-w/2);el.setAttribute('y',cy-h/2);el.setAttribute('width',w);el.setAttribute('height',h);el.setAttribute('rx',Math.min(w,h)/2);
  const rot=(-f*32 - (off>0?f*6:0))*(1-m);
  el.setAttribute('transform',`rotate(${rot} ${cx} ${cy}) translate(${cx} ${cy}) scale(1 ${s}) translate(${-cx} ${-cy})`);
 });
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
//ENDJS
</script></body></html>
