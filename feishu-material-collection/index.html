    <title>Feishu material collection — interactive demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #eeedeb; overflow: hidden; }
      /* Contain scale-to-fit: full 1180×640 stage always visible (no L/R clip).
         Sand extends into leftover viewport; product window is never cropped/stretched.
         Kit Stage keeps design size 1180 (scale 1); CSS --fs-scale is the only live fit.
         Film/__ssVerification forces --fs-scale:1 so stills match design. */
      .fs-portable {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #eeedeb;
      }
      .fs-portable .ss-fit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1180px !important;
        max-width: none !important;
        height: 640px !important;
        transform: translate(-50%, -50%) scale(var(--fs-scale, 1));
        transform-origin: center center;
      }
    </style>
